<title>每日健康</title>
<style>
:root{
  --cream:#FDF9EE;--mist:#B6C2CF;--fog:#DBDDDA;--stone:#97979C;--ink:#2E2B2C;
  --glass:rgba(255,255,255,.45);--line:rgba(255,255,255,.8);
  --ease:cubic-bezier(.2,.9,.25,1);color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--ink)}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 流动背景 */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--cream)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.b1{width:380px;height:380px;background:var(--mist);opacity:.55;top:-120px;left:-120px;animation:d1 18s ease-in-out infinite alternate}
.b2{width:330px;height:330px;background:var(--fog);opacity:.95;top:40%;right:-140px;animation:d2 22s ease-in-out infinite alternate}
.b3{width:280px;height:280px;background:var(--stone);opacity:.16;bottom:-100px;left:10%;animation:d3 20s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(220px,90px) scale(1.1)}}
@keyframes d2{to{transform:translate(-200px,-120px) scale(.9)}}
@keyframes d3{to{transform:translate(140px,-160px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.view{display:none}
.view.active{display:block;animation:fade .45s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.ptitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 4px 18px}
.ptitle .sub{font-size:14px;color:var(--stone);margin-bottom:4px}
.ptitle h1{margin:0;font-size:34px;font-weight:600;letter-spacing:.5px}

/* 玻璃卡片 */
.card{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(151,151,156,.14)}
.rise .card{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch h3{margin:0;font-size:16px;font-weight:600}
.ch .tr{margin-left:auto;font-size:13px;color:var(--stone)}
.ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(182,194,207,.45);color:rgba(46,43,44,.75)}
.ic svg.i{width:15px;height:15px}

.soft{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.55);
  border:1px solid var(--fog);font-weight:600;font-size:15px;transition:transform .25s var(--ease),background .2s,opacity .2s}
.soft:active{transform:scale(.95);background:rgba(255,255,255,.9)}
.soft:disabled{opacity:.4}
.soft svg.i{width:16px;height:16px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);border:1px solid var(--fog);transition:transform .25s var(--ease)}
.iconbtn:active{transform:scale(.92)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{font-size:14px;color:var(--stone);margin:0 0 12px}

/* 喝水 */
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:16px}
.cup{height:30px;border-radius:999px;background:rgba(219,221,218,.7);border:1px solid rgba(255,255,255,.6);transition:background .35s var(--ease)}
.cup.on{background:var(--mist)}
.cup.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.12,1.2)}}

/* 小勾 */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:18px;background:rgba(255,255,255,.3);transition:background .3s}
.chip .dot{position:relative;width:42px;height:42px;border-radius:50%;background:rgba(219,221,218,.6);color:var(--stone);display:grid;place-items:center;transition:background .35s var(--ease),transform .35s var(--ease),color .3s}
.chip .dot>span{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .25s,transform .35s var(--ease)}
.chip .on-ic{opacity:0;transform:scale(.4)}
.chip.on{background:rgba(255,255,255,.6)}
.chip.on .dot{background:var(--mist);color:#fff;transform:scale(1.06)}
.chip.on .off-ic{opacity:0;transform:scale(.4)}
.chip.on .on-ic{opacity:1;transform:scale(1)}
.chip .lb{font-size:13px}

/* 条目 */
.entry{display:flex;gap:12px;width:100%;text-align:left;padding:12px;border-radius:16px;background:rgba(255,255,255,.45);margin-bottom:8px;transition:transform .2s var(--ease)}
.entry:active{transform:scale(.98)}
.entry .t{width:72px;flex:none}
.entry .t b{display:block;font-size:15px;font-weight:600}
.entry .t small{display:block;font-size:11px;color:var(--stone);margin-top:2px}
.entry .p{display:block;flex:1;font-size:14px;line-height:1.45;color:rgba(46,43,44,.85);white-space:pre-wrap;word-break:break-word}
.entry .p.val{font-size:20px;font-weight:600;color:var(--ink)}
.big{font-size:34px;font-weight:600}
.unit{color:var(--stone);margin-left:6px}

textarea.note{width:100%;border:0;outline:0;resize:none;background:rgba(255,255,255,.45);border-radius:16px;padding:12px;line-height:1.45;min-height:46px;overflow:hidden;display:block}
textarea.note::placeholder,.inp::placeholder{color:var(--stone)}

/* 睡眠 */
.sleep{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sleep .dur{grid-column:1 / -1;order:3;padding-top:4px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--stone)}
.tcol input{width:100%;-webkit-appearance:none;appearance:none;border:1px solid var(--fog);background:rgba(255,255,255,.55);border-radius:12px;padding:8px 10px;min-width:96px;min-height:40px;text-align:center;font-weight:600;color:var(--ink)}
.dur{text-align:center}
.dur b{display:block;font-size:22px;font-weight:600;white-space:nowrap}
.dur small{font-size:12px;color:var(--stone)}

/* 底部标签栏 */
.tabbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,92px);padding:6px;border-radius:999px;
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--line);box-shadow:0 12px 34px rgba(46,43,44,.12);z-index:10}
.tabbar .ind{position:absolute;top:6px;left:6px;width:92px;height:calc(100% - 12px);border-radius:999px;background:rgba(182,194,207,.55);transition:transform .45s var(--ease)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:11px;color:var(--stone);transition:color .3s}
.tab.active{color:var(--ink)}
.tab svg.i{width:20px;height:20px}

/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:17px;font-weight:600}
.navb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.5)}
.navb:disabled{opacity:.3}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk span{font-size:12px;color:var(--stone);padding-bottom:6px}
.dc{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:15px;margin:2px;transition:background .25s,color .25s}
.dc.today{box-shadow:inset 0 0 0 1.5px var(--mist)}
.dc.sel{background:var(--ink);color:var(--cream)}
.dc:disabled{color:rgba(151,151,156,.45)}
.dc.has::after{content:"";position:absolute;bottom:5px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--mist)}
.dc.sel.has::after{background:var(--cream)}
.dtitle{font-size:18px;font-weight:600;margin:4px 4px 14px}

/* 分段选择 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:14px;background:rgba(219,221,218,.6)}
.seg button{padding:8px 0;font-size:14px;border-radius:10px;transition:background .3s,box-shadow .3s}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(46,43,44,.08);font-weight:600}
.seg.wrap{display:flex;flex-wrap:wrap;gap:8px;background:none;padding:0}
.seg.wrap button{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid var(--fog)}
.seg.wrap button.on{background:var(--mist);border-color:var(--mist);box-shadow:none}
.unitseg{margin-bottom:16px}

/* 图表 */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ln{fill:none;stroke:rgba(46,43,44,.7);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.rise .chart .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .pt{fill:var(--mist);stroke:#fff;stroke-width:2}
.chart text{font-size:10px;fill:var(--stone);font-family:ui-rounded,-apple-system,sans-serif}
.chart .gl{stroke:rgba(151,151,156,.3);stroke-dasharray:3 4}
.wrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.45);margin-bottom:8px;font-size:14px;transition:transform .2s var(--ease)}
.wrow:active{transform:scale(.98)}
.wrow b{font-size:15px;font-weight:600}

/* 底部弹出层 */
.scrim{position:fixed;inset:0;background:rgba(46,43,44,.2);opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:rgba(253,249,238,.94);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:28px 28px 0 0;border:1px solid var(--line);
  padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(105%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;z-index:21;max-height:88vh;overflow:auto}
.sheet.show{transform:none;visibility:visible;transition:transform .45s var(--ease)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fog);margin:0 auto 12px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sh h2{margin:0;font-size:17px;font-weight:600}
.sh .x{color:var(--stone);font-size:15px;padding:6px;min-width:44px;text-align:left}
.sh .ok{font-weight:600;padding:6px;min-width:44px;text-align:right}
.sh .ok:disabled{opacity:.35}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:var(--stone);margin:0 4px 6px}
.inp{width:100%;border:1px solid var(--fog);background:rgba(255,255,255,.7);border-radius:14px;padding:12px 14px;outline:0;-webkit-appearance:none;appearance:none;min-height:46px;color:var(--ink)}
.inp:focus{border-color:var(--mist)}
.inwrap{position:relative}
.inwrap .u{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--stone)}
.inp.bignum{font-size:28px;font-weight:600;padding-right:80px}
textarea.inp{resize:none;min-height:96px;line-height:1.45}
.danger{width:100%;padding:13px;border-radius:14px;background:rgba(255,255,255,.6);color:#9a5b58;font-weight:600;margin-top:6px}
.hint{font-size:13px;color:var(--stone);line-height:1.6;margin:0 4px 14px}
.wide{width:100%;justify-content:center;margin-bottom:10px}

.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translate(-50%,-160%);padding:10px 18px;border-radius:999px;
  background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);
  font-size:14px;box-shadow:0 8px 24px rgba(46,43,44,.12);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;z-index:30;white-space:nowrap}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--ease)}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<main class="app">
  <section class="view" id="v-today">
    <div class="ptitle">
      <div><div class="sub" id="todaySub"></div><h1>今天</h1></div>
      <button class="iconbtn" data-act="backup" aria-label="备份"></button>
    </div>
    <div id="todayDay"></div>
  </section>

  <section class="view" id="v-hist">
    <div class="ptitle"><div><h1>历史</h1></div></div>
    <div class="card" id="cal"></div>
    <div class="dtitle" id="histTitle"></div>
    <div id="histDay"></div>
  </section>

  <section class="view" id="v-weight">
    <div class="ptitle">
      <div><div class="sub">每周称一次就好</div><h1>体重</h1></div>
      <button class="soft" data-act="w-add" id="wAddBtn"></button>
    </div>
    <div id="weightBody"></div>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <div class="ind" id="ind"></div>
  <button class="tab" data-act="tab" data-tab="today"></button>
  <button class="tab" data-act="tab" data-tab="hist"></button>
  <button class="tab" data-act="tab" data-tab="weight"></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
/* ---------- 图标 ---------- */
const svg = p => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I = {
  drop: svg('<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'),
  feet: svg('<path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4M4 13h4"/>'),
  pill: svg('<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>'),
  fork: svg('<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>'),
  run: svg('<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'),
  moon: svg('<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'),
  phone: svg('<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>'),
  gauge: svg('<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>'),
  scale: svg('<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M8 10a4 4 0 0 1 8 0"/><path d="m12 10 1.6-2"/>'),
  cal: svg('<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  minus: svg('<path d="M5 12h14"/>'),
  check: svg('<path d="M20 6 9 17l-5-5"/>'),
  left: svg('<path d="m15 18-6-6 6-6"/>'),
  right: svg('<path d="m9 18 6-6-6-6"/>'),
  save: svg('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>'),
  chart: svg('<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>'),
  list: svg('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
  clip: svg('<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>')
};

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const dayTitle = k => { const d = fromKey(k); return `${d.getMonth() + 1}月${d.getDate()}日 星期${WEEK[d.getDay()]}`; };
const fullDate = k => { const d = fromKey(k); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; };
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseNum = s => { const v = parseFloat(String(s).replace(',', '.')); return isFinite(v) ? v : NaN; };

/* ---------- 数据（只存在这台手机上） ---------- */
const KEY = 'dailyHealth.v1';
const blank = () => ({ water: 0, breakfast: false, walk: false, med: false, exercise: '', screen: '', steps: null, sleepStart: '', wake: '', meals: [], glucose: [] });

function normalize(d) {
  const out = { days: {}, weights: [], unit: '斤' };
  if (d && typeof d === 'object') {
    if (d.days && typeof d.days === 'object') out.days = d.days;
    if (Array.isArray(d.weights)) out.weights = d.weights;
    if (d.unit === 'kg' || d.unit === '斤') out.unit = d.unit;
  }
  return out;
}
function load() {
  try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return normalize(null); }
}
let db = load();
let curTab = 'today';
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('保存失败，记得导出备份'); }
  if (curTab === 'hist') renderCalendar();
}
const getDay = k => ({ ...blank(), ...(db.days[k] || {}) });
function edit(k, fn) { const d = getDay(k); fn(d); db.days[k] = d; save(); return d; }
const hasContent = d => !!d && (d.water > 0 || d.breakfast || d.walk || d.med || (d.exercise || '').trim() || (d.screen || '').trim()
  || d.steps != null || d.sleepStart || d.wake || (d.meals || []).length || (d.glucose || []).length);

function sleepMin(d) {
  if (!d.sleepStart || !d.wake) return null;
  const [sh, sm] = d.sleepStart.split(':').map(Number), [wh, wm] = d.wake.split(':').map(Number);
  const m = ((wh * 60 + wm) - (sh * 60 + sm) + 1440) % 1440;
  return m || null;
}
function durText(d) {
  const m = sleepMin(d); if (m == null) return '—';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h} 小时 ${r} 分` : `${h} 小时`;
}

/* ---------- 一天的卡片 ---------- */
const head = (icon, title, tr = '', trAttr = '') =>
  `<div class="ch"><span class="ic">${icon}</span><h3>${title}</h3><span class="tr" ${trAttr}>${tr}</span></div>`;
const waterLabel = n => `${n} 杯 · ${n * 500} ml`;
const sortT = a => [...a].sort((x, y) => (x.time || '').localeCompare(y.time || ''));
const entry = (act, x, tag, text, cls = '') =>
  `<button class="entry" data-act="${act}" data-id="${esc(x.id)}"><span class="t"><b class="num">${esc(x.time)}</b><small>${esc(tag)}</small></span><span class="p ${cls}">${text}</span></button>`;

function dayCards(k) {
  const d = getDay(k);
  const chip = (f, label, icon) =>
    `<button class="chip ${d[f] ? 'on' : ''}" data-act="flag" data-f="${f}"><span class="dot"><span class="off-ic">${icon}</span><span class="on-ic">${I.check}</span></span><span class="lb">${label}</span></button>`;
  const note = (f, i, icon, title, ph) =>
    `<section class="card" style="--i:${i}">${head(icon, title)}<textarea class="note" rows="1" data-f="${f}" placeholder="${ph}">${esc(d[f])}</textarea></section>`;

  return `
  <section class="card" style="--i:0">
    ${head(I.drop, '喝水', waterLabel(d.water), 'data-wl')}
    <div class="cups">${Array.from({ length: 8 }, (_, i) => `<button class="cup ${i < d.water ? 'on' : ''}" data-act="cup" data-i="${i}" aria-label="第${i + 1}杯"></button>`).join('')}</div>
    <div class="row">
      <button class="soft" data-act="water-" ${d.water ? '' : 'disabled'} aria-label="减一杯">${I.minus}</button>
      <button class="soft" data-act="water+">${I.plus}喝了一杯</button>
    </div>
  </section>

  <section class="card" style="--i:1"><div class="chips">
    ${chip('breakfast', '吃了早餐', I.sun)}${chip('walk', '饭后走了走', I.feet)}${chip('med', '吃了药', I.pill)}
  </div></section>

  <section class="card" style="--i:2">
    ${head(I.fork, '饮食', d.meals.length ? `${d.meals.length} 次` : '')}
    ${d.meals.length ? sortT(d.meals).map(m => entry('meal-edit', m, m.kind, esc(m.content))).join('') : '<p class="empty">还没有记录</p>'}
    <button class="soft" data-act="meal-add">${I.plus}记一餐</button>
  </section>

  <section class="card" style="--i:3">
    ${head(I.feet, '步数', d.steps != null ? '已记录' : '')}
    <div class="row">
      <div><span class="big num">${d.steps != null ? Number(d.steps).toLocaleString('zh-CN') : '—'}</span><span class="unit">步</span></div>
      <button class="soft" data-act="steps">${d.steps != null ? '修改' : '填写'}</button>
    </div>
  </section>

  ${note('exercise', 4, I.run, '运动', '今天做了什么运动、大概多久')}

  <section class="card" style="--i:5">
    ${head(I.moon, '睡眠', '按起床那天记录')}
    <div class="sleep">
      <label class="tcol">入睡<input type="time" data-f="sleepStart" value="${esc(d.sleepStart)}"></label>
      <div class="dur"><b class="num" data-dur>${durText(d)}</b><small>共睡</small></div>
      <label class="tcol">起床<input type="time" data-f="wake" value="${esc(d.wake)}"></label>
    </div>
  </section>

  ${note('screen', 6, I.phone, '屏幕时间', '手机 / 电脑 / iPad 各用了多久')}

  <section class="card" style="--i:7">
    ${head(I.gauge, '血糖', '可选 · mmol/L')}
    ${sortT(d.glucose).map(g => entry('glu-edit', g, g.context, Number(g.value).toFixed(1), 'val num')).join('')}
    <button class="soft" data-act="glu-add">${I.plus}记一次</button>
  </section>`;
}

const grow = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
function mountDay(el, k, animate) {
  el.dataset.day = k;
  el.classList.toggle('rise', !!animate);
  el.innerHTML = dayCards(k);
  el.querySelectorAll('textarea.note').forEach(grow);
}
function rerenderDay(k) {
  document.querySelectorAll(`[data-day="${k}"]`).forEach(el => mountDay(el, k, false));
  if (curTab === 'hist') renderCalendar();
}

function setWater(box, k, n) {
  const before = getDay(k).water;
  n = Math.max(0, n);
  edit(k, d => { d.water = n; });
  box.querySelector('[data-wl]').textContent = waterLabel(n);
  box.querySelectorAll('.cup').forEach((c, i) => {
    c.classList.toggle('on', i < n);
    if (n > before && i === Math.min(n, 8) - 1) { c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
  });
  box.querySelector('[data-act="water-"]').disabled = n === 0;
}

/* ---------- 今天 ---------- */
let todayKey = keyOf(new Date());
function renderToday(animate) {
  todayKey = keyOf(new Date());
  $('#todaySub').textContent = dayTitle(todayKey);
  mountDay($('#todayDay'), todayKey, animate);
}

/* ---------- 历史 ---------- */
let selKey = todayKey;
let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
function renderCalendar() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const now = new Date(), tk = keyOf(now);
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const n = new Date(y, m + 1, 0).getDate();
  const atNow = y === now.getFullYear() && m === now.getMonth();
  let cells = '<span></span>'.repeat(offset);
  for (let i = 1; i <= n; i++) {
    const k = `${y}-${pad(m + 1)}-${pad(i)}`;
    const cls = ['dc', 'num', k === tk ? 'today' : '', k === selKey ? 'sel' : '', hasContent(db.days[k]) ? 'has' : ''].join(' ');
    cells += `<button class="${cls}" data-act="cal-day" data-k="${k}" ${k > tk ? 'disabled' : ''}>${i}</button>`;
  }
  $('#cal').innerHTML = `
    <div class="cal-head"><button class="navb" data-act="cal-prev" aria-label="上个月">${I.left}</button>
      <b>${y}年${m + 1}月</b>
      <button class="navb" data-act="cal-next" aria-label="下个月" ${atNow ? 'disabled' : ''}>${I.right}</button></div>
    <div class="wk">${['一', '二', '三', '四', '五', '六', '日'].map(w => `<span>${w}</span>`).join('')}</div>
    <div class="grid">${cells}</div>`;
}
function renderHist(animate) {
  renderCalendar();
  $('#histTitle').textContent = dayTitle(selKey);
  mountDay($('#histDay'), selKey, animate);
}

/* ---------- 体重 ---------- */
function smoothPath(p) {
  if (p.length < 3) return 'M' + p.map(q => q.join(',')).join(' L');
  let d = `M${p[0]}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    const c1 = [+(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1), +(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)];
    const c2 = [+(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1), +(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)];
    d += ` C${c1} ${c2} ${p2}`;
  }
  return d;
}
function chartSVG(ws, disp) {
  const W = 320, H = 180, L = 36, R = 12, T = 12, B = 24;
  const vals = ws.map(w => disp(w.kg));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const padv = (hi - lo) * 0.15; lo -= padv; hi += padv;
  const ts = ws.map(w => fromKey(w.date).getTime());
  const t0 = Math.min(...ts), t1 = Math.max(...ts), span = (t1 - t0) || 1;
  const X = t => +(L + (W - L - R) * ((t - t0) / span)).toFixed(1);
  const Y = v => +(T + (H - T - B) * (1 - (v - lo) / (hi - lo))).toFixed(1);
  const pts = ws.map((w, i) => [X(ts[i]), Y(vals[i])]);
  let grid = '';
  for (let j = 0; j < 3; j++) {
    const v = lo + (hi - lo) * (j + 0.5) / 3, y = Y(v);
    grid += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 3}" text-anchor="end">${v.toFixed(0)}</text>`;
  }
  const md = k => { const d = fromKey(k); return `${d.getMonth() + 1}/${d.getDate()}`; };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="体重走势">
    ${grid}
    <text x="${L}" y="${H - 6}">${md(ws[0].date)}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end">${md(ws[ws.length - 1].date)}</text>
    <path class="ln" pathLength="1" d="${smoothPath(pts)}"/>
    ${pts.map(p => `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="4.5"/>`).join('')}
  </svg>`;
}
function renderWeight(animate) {
  const el = $('#weightBody');
  el.classList.toggle('rise', !!animate);
  const u = db.unit, uname = u === '斤' ? '斤' : '公斤';
  const disp = kg => u === '斤' ? kg * 2 : kg;
  const ws = [...db.weights].sort((a, b) => a.date.localeCompare(b.date));
  let h = `<div class="seg unitseg">${[['斤', '斤'], ['kg', '公斤']].map(([v, n]) => `<button data-act="unit" data-v="${v}" class="${v === u ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  if (!ws.length) {
    h += `<section class="card" style="--i:0"><h3 style="margin:0 0 6px;font-size:16px">还没有记录</h3>
      <p class="hint" style="margin:0">固定在每周同一天、早上起床后称，会更准一些。</p></section>`;
  } else {
    const last = ws[ws.length - 1];
    h += `<section class="card" style="--i:0">
      <div class="hint" style="margin:0 0 6px">最近一次 · ${fullDate(last.date)}</div>
      <span class="num" style="font-size:44px;font-weight:600">${disp(last.kg).toFixed(1)}</span><span class="unit">${uname}</span>
    </section>`;
    if (ws.length >= 2) h += `<section class="card" style="--i:1">${head(I.chart, '走势')}${chartSVG(ws, disp)}</section>`;
    h += `<section class="card" style="--i:2">${head(I.list, '全部记录')}
      ${[...ws].reverse().map(w => `<button class="wrow" data-act="w-edit" data-id="${esc(w.id)}"><span>${fullDate(w.date)}</span><b class="num">${disp(w.kg).toFixed(1)} ${uname}</b></button>`).join('')}
    </section>`;
  }
  el.innerHTML = h;
}

/* ---------- 底部弹出层 ---------- */
const sheet = $('#sheet'), scrim = $('#scrim');
function openSheet(o) {
  sheet.innerHTML = `<div class="grab"></div>
    <div class="sh"><button class="x" data-close>${o.noOk ? '' : '取消'}</button><h2>${o.title}</h2>
    ${o.noOk ? '<button class="ok" data-close>完成</button>' : '<button class="ok" data-ok>保存</button>'}</div>${o.body}`;
  const ok = sheet.querySelector('[data-ok]');
  const check = () => { if (ok && o.valid) ok.disabled = !o.valid(sheet); };
  sheet.oninput = check;
  sheet.onchange = e => o.onChange && o.onChange(e, sheet);
  sheet.onclick = e => {
    const s = e.target.closest('[data-seg] button');
    if (s) { s.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === s)); check(); return; }
    if (e.target.closest('[data-close]')) return closeSheet();
    if (e.target.closest('[data-ok]')) {
      if (o.valid && !o.valid(sheet)) return;
      o.onSave && o.onSave(sheet); closeSheet(); o.after && o.after(); return;
    }
    const del = e.target.closest('[data-del]');
    if (del) {
      if (!del.dataset.armed) { del.dataset.armed = '1'; del.textContent = '再点一次确认删除'; return; }
      o.onDelete && o.onDelete(); closeSheet(); o.after && o.after(); return;
    }
    o.onClick && o.onClick(e, sheet);
  };
  check();
  sheet.scrollTop = 0;
  requestAnimationFrame(() => { scrim.classList.add('show'); sheet.classList.add('show'); });
}
function closeSheet() {
  if (document.activeElement) document.activeElement.blur();
  scrim.classList.remove('show'); sheet.classList.remove('show');
}
scrim.addEventListener('click', closeSheet);
const segVal = el => { const b = el.querySelector('[data-seg] button.on'); return b ? b.dataset.v : ''; };
const segHTML = (opts, cur, wrap) => `<div class="seg ${wrap ? 'wrap' : ''}" data-seg>${opts.map(x => `<button type="button" data-v="${x}" class="${x === cur ? 'on' : ''}">${x}</button>`).join('')}</div>`;

const KINDS = ['早餐', '午餐', '晚餐', '加餐'];
const guessKind = () => { const h = new Date().getHours(); return h < 11 ? '早餐' : h < 16 ? '午餐' : h < 21 ? '晚餐' : '加餐'; };
function mealSheet(k, id) {
  const m = id ? getDay(k).meals.find(x => x.id === id) : null;
  openSheet({
    title: m ? '编辑' : '记一餐',
    body: `<div class="fld">${segHTML(KINDS, m ? m.kind : guessKind())}</div>
      <div class="fld"><label>时间</label><input class="inp" type="time" name="time" value="${esc(m ? m.time : nowTime())}"></div>
      <div class="fld"><label>吃了什么</label><textarea class="inp" name="content" placeholder="比如：全麦三明治、油麦菜、鸡蛋">${esc(m ? m.content : '')}</textarea></div>
      ${m ? '<button class="danger" data-del>删除这一餐</button>' : ''}`,
    valid: el => el.querySelector('[name=content]').value.trim().length > 0,
    onSave: el => {
      const v = { kind: segVal(el), time: el.querySelector('[name=time]').value || nowTime(), content: el.querySelector('[name=content]').value.trim() };
      edit(k, d => { if (m) Object.assign(d.meals.find(x => x.id === id), v); else d.meals.push({ id: uid(), ...v }); });
    },
    onDelete: () => edit(k, d => { d.meals = d.meals.filter(x => x.id !== id); }),
    after: () => rerenderDay(k)
  });
}

const CONTEXTS = ['空腹', '餐前', '餐后1小时', '餐后2小时', '随机'];
function gluSheet(k, id) {
  const g = id ? getDay(k).glucose.find(x => x.id === id) : null;
  openSheet({
    title: g ? '编辑' : '记一次血糖',
    body: `<div class="fld"><div class="inwrap"><input class="inp bignum num" name="v" inputmode="decimal" placeholder="比如 5.6" value="${g ? Number(g.value).toFixed(1) : ''}"><span class="u">mmol/L</span></div></div>
      <div class="fld"><label>什么时候测的</label>${segHTML(CONTEXTS, g ? g.context : '餐后2小时', true)}</div>
      <div class="fld"><label>时间</label><input class="inp" type="time" name="time" value="${esc(g ? g.time : nowTime())}"></div>
      ${g ? '<button class="danger" data-del>删除这条</button>' : ''}`,
    valid: el => parseNum(el.querySelector('[name=v]').value) > 0,
    onSave: el => {
      const v = { value: parseNum(el.querySelector('[name=v]').value), context: segVal(el), time: el.querySelector('[name=time]').value || nowTime() };
      edit(k, d => { if (g) Object.assign(d.glucose.find(x => x.id === id), v); else d.glucose.push({ id: uid(), ...v }); });
    },
    onDelete: () => edit(k, d => { d.glucose = d.glucose.filter(x => x.id !== id); }),
    after: () => rerenderDay(k)
  });
}

function stepsSheet(k) {
  const d = getDay(k);
  openSheet({
    title: '步数',
    body: `<div class="fld"><div class="inwrap"><input class="inp bignum num" name="s" inputmode="numeric" placeholder="比如 8000" value="${d.steps != null ? d.steps : ''}"><span class="u">步</span></div></div>
      <button class="soft wide" type="button" data-paste>${I.clip}从剪贴板粘贴</button>
      <p class="hint">在 iPhone 的「快捷指令」里建一个：查找健康样本（类型：步数，日期：今天）→ 计算统计数据（总和）→ 拷贝到剪贴板。跑一下快捷指令，再回来点「从剪贴板粘贴」就好。清空数字再保存，就是不记录。</p>`,
    valid: el => { const v = el.querySelector('[name=s]').value.trim(); return v === '' || /^\d+$/.test(v.replace(/[,，\s]/g, '')); },
    onClick: async (e, el) => {
      if (!e.target.closest('[data-paste]')) return;
      try {
        const t = await navigator.clipboard.readText();
        const n = (t.replace(/[,，\s]/g, '').match(/\d+(\.\d+)?/) || [])[0];
        if (n) { el.querySelector('[name=s]').value = Math.round(parseFloat(n)); el.oninput(); }
        else toast('剪贴板里没有找到数字');
      } catch (err) { toast('没能读取剪贴板，可以手动输入'); }
    },
    onSave: el => {
      const v = el.querySelector('[name=s]').value.replace(/[,，\s]/g, '');
      edit(k, d => { d.steps = v === '' ? null : parseInt(v, 10); });
    },
    after: () => rerenderDay(k)
  });
}

function weightSheet(id) {
  const w = id ? db.weights.find(x => x.id === id) : null;
  const u = db.unit, disp = kg => u === '斤' ? kg * 2 : kg;
  const tk = keyOf(new Date());
  openSheet({
    title: w ? '编辑体重' : '记体重',
    body: `<div class="fld"><div class="inwrap"><input class="inp bignum num" name="v" inputmode="decimal" placeholder="${u === '斤' ? '比如 205.7' : '比如 102.9'}" value="${w ? disp(w.kg).toFixed(1) : ''}"><span class="u">${u === '斤' ? '斤' : '公斤'}</span></div></div>
      <div class="fld"><label>日期</label><input class="inp" type="date" name="d" max="${tk}" value="${w ? w.date : tk}"></div>
      ${w ? '<button class="danger" data-del>删除这条</button>' : ''}`,
    valid: el => parseNum(el.querySelector('[name=v]').value) > 0 && !!el.querySelector('[name=d]').value,
    onSave: el => {
      const v = parseNum(el.querySelector('[name=v]').value);
      const kg = u === '斤' ? v / 2 : v, date = el.querySelector('[name=d]').value;
      if (w) Object.assign(w, { kg, date }); else db.weights.push({ id: uid(), date, kg });
      save();
    },
    onDelete: () => { db.weights = db.weights.filter(x => x.id !== id); save(); },
    after: () => renderWeight(false)
  });
}

function backupSheet() {
  openSheet({
    title: '备份',
    noOk: true,
    body: `<p class="hint">记录只保存在这台手机上。偶尔导出一份备份，换手机或清理 Safari 数据时就不怕丢。</p>
      <button class="soft wide" type="button" data-export>${I.save}导出备份文件</button>
      <button class="soft wide" type="button" data-copy>${I.clip}复制备份文本</button>
      <label class="soft wide">从备份文件恢复<input type="file" accept=".json,application/json" hidden data-import></label>
      <div class="fld" style="margin-top:6px"><label>或者粘贴备份文本恢复</label><textarea class="inp" name="paste" placeholder="粘贴之前复制的备份文本"></textarea></div>
      <button class="soft wide" type="button" data-restore>用粘贴的文本恢复</button>`,
    onClick: async (e, el) => {
      const json = JSON.stringify(db);
      if (e.target.closest('[data-export]')) {
        const name = `每日健康备份-${keyOf(new Date())}.json`;
        const file = new File([json], name, { type: 'application/json' });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
        } catch (err) { if (err && err.name === 'AbortError') return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      } else if (e.target.closest('[data-copy]')) {
        try { await navigator.clipboard.writeText(json); toast('已复制，可以存到备忘录里'); } catch (err) { toast('复制失败'); }
      } else if (e.target.closest('[data-restore]')) {
        restore(el.querySelector('[name=paste]').value);
      }
    },
    onChange: (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => restore(r.result);
      r.readAsText(f);
    }
  });
}
function restore(text) {
  try {
    const d = JSON.parse(text);
    if (!d || typeof d.days !== 'object') throw 0;
    db = normalize(d); save(); closeSheet(); toast('已恢复');
    switchTab(curTab);
  } catch (e) { toast('这不是有效的备份'); }
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 标签切换 ---------- */
const TABS = ['today', 'hist', 'weight'];
function switchTab(t) {
  curTab = t;
  TABS.forEach((x, i) => {
    $('#v-' + x).classList.toggle('active', x === t);
    document.querySelector(`.tab[data-tab="${x}"]`).classList.toggle('active', x === t);
    if (x === t) $('#ind').style.transform = `translateX(${i * 100}%)`;
  });
  window.scrollTo(0, 0);
  if (t === 'today') renderToday(true);
  if (t === 'hist') renderHist(true);
  if (t === 'weight') renderWeight(true);
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.closest('#sheet')) return;
  const box = b.closest('[data-day]'), k = box && box.dataset.day;
  switch (b.dataset.act) {
    case 'tab': if (b.dataset.tab !== curTab) switchTab(b.dataset.tab); break;
    case 'cup': { const i = +b.dataset.i, n = getDay(k).water; setWater(box, k, i + 1 === n ? i : i + 1); break; }
    case 'water+': setWater(box, k, getDay(k).water + 1); break;
    case 'water-': setWater(box, k, getDay(k).water - 1); break;
    case 'flag': { const f = b.dataset.f; const d = edit(k, d => { d[f] = !d[f]; }); b.classList.toggle('on', d[f]); break; }
    case 'meal-add': mealSheet(k, null); break;
    case 'meal-edit': mealSheet(k, b.dataset.id); break;
    case 'glu-add': gluSheet(k, null); break;
    case 'glu-edit': gluSheet(k, b.dataset.id); break;
    case 'steps': stepsSheet(k); break;
    case 'cal-prev': calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCalendar(); break;
    case 'cal-next': calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCalendar(); break;
    case 'cal-day':
      selKey = b.dataset.k; renderCalendar();
      $('#histTitle').textContent = dayTitle(selKey);
      mountDay($('#histDay'), selKey, true);
      break;
    case 'unit': db.unit = b.dataset.v; save(); renderWeight(false); break;
    case 'w-add': weightSheet(null); break;
    case 'w-edit': weightSheet(b.dataset.id); break;
    case 'backup': backupSheet(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('textarea.note')) {
    grow(t);
    const k = t.closest('[data-day]').dataset.day;
    edit(k, d => { d[t.dataset.f] = t.value; });
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('.tcol input')) {
    const box = t.closest('[data-day]'), k = box.dataset.day;
    const d = edit(k, d => { d[t.dataset.f] = t.value; });
    box.querySelector('[data-dur]').textContent = durText(d);
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && curTab === 'today' && keyOf(new Date()) !== todayKey) renderToday(true);
});

/* ---------- 启动 ---------- */
document.querySelector('[data-act="backup"]').innerHTML = I.save;
$('#wAddBtn').innerHTML = `${I.plus}记录`;
document.querySelector('.tab[data-tab="today"]').innerHTML = `${I.sun}<span>今天</span>`;
document.querySelector('.tab[data-tab="hist"]').innerHTML = `${I.cal}<span>历史</span>`;
document.querySelector('.tab[data-tab="weight"]').innerHTML = `${I.scale}<span>体重</span>`;

// 网址带 ?steps=数字 时，自动填入今天的步数
const qs = new URLSearchParams(location.search).get('steps');
if (qs && /^\d+$/.test(qs)) {
  edit(keyOf(new Date()), d => { d.steps = parseInt(qs, 10); });
  history.replaceState(null, '', location.pathname);
  setTimeout(() => toast(`已填入 ${Number(qs).toLocaleString('zh-CN')} 步`), 400);
}

switchTab('today');
})();
</script>
</body>
